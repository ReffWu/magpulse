name: MagPulse
options:
  bundleIdPrefix: com.reffwu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "YVRAA57U55"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  MagPulse:
    type: application
    platform: macOS
    sources:
      - path: Sources/MagPulse
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/MagPulse/Info.plist
      properties:
        CFBundleName: MagPulse
        CFBundleDisplayName: MagPulse
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        # Sparkle 2 自动更新配置（共享 Reff 生态统一 EdDSA 公钥）
        SUFeedURL: https://github.com/ReffWu/magpulse/releases/latest/download/appcast.xml
        SUPublicEDKey: wpcSIsJIvvZPj3jAoJuw8wl0+fVXS3K3ChODZ0W8EBI=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
        # URL Scheme: magpulse://
        CFBundleURLTypes:
          - CFBundleURLName: com.reffwu.magpulse
            CFBundleURLSchemes:
              - magpulse
